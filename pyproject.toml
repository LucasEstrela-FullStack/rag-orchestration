[project]
name = "rag-orchestration"
version = "0.1.0"
description = "Pipeline RAG pronto para produção com Inngest, Qdrant, LlamaIndex, Ollama e Streamlit"
requires-python = ">=3.12"
dependencies = [
    "ollama>=0.6.3",
    "python-dotenv>=1.2.4",
    "qdrant-client>=1.20.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
